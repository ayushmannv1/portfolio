.ipv{display:flex;align-items:center;min-height:120px;padding:16px 24px;margin-bottom:16px;border:1px solid var(--bd);border-radius:10px;background:#000;overflow:hidden}
.ipt{color:#f4f2ec;line-height:1;white-space:nowrap}

</style>
